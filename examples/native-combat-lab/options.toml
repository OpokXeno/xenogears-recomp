# Insert these tables before [[native_module]] in the generated manifest.
# Replace the basic packer's example option tables; keep its feature ID "hook".

[[option]]
feature = "hook"
id = "damage_mode"
label = "Damage behavior"
type = "choice"
default = "extend"
choice = [
    { value = "observe", label = "Observe original behavior" },
    { value = "extend", label = "Adjust original damage" },
    { value = "replace", label = "Replace damage calculation" }
]

[[option]]
feature = "hook"
id = "log_calls"
label = "Log diagnostic messages"
type = "boolean"
default = true

[[option]]
feature = "hook"
id = "damage_percent"
